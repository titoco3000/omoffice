[package]
name = "omoffice-api"
version = "0.1.0"
edition = "2021"
# Two binaries (see [[bin]] below): plain `cargo run` means the API server.
default-run = "omoffice-api"

# No src/ directory in this layout: main.rs sits directly in backend/, and
# everything else -- core/, features/, router.rs, schema.rs -- is the library
# crate under lib/, so it's exercisable headless (`cargo test --lib`)
# independently of the binary that wires it up.
[lib]
name = "omoffice_api"
path = "lib/lib.rs"

[[bin]]
name = "omoffice-api"
path = "main.rs"

# The office map's AppSync Events authorizer (`features::map::realtime`),
# deployed as its own Lambda. Lambda-only: there is no AppSync locally, so
# a plain `cargo build`/`make run` skips it.
[[bin]]
name = "map-authorizer"
path = "map_authorizer.rs"
required-features = ["lambda"]

# `make run`/`cargo run` builds with no features: `core::communication::
# web_messenger::local_web_socket` is the whole websocket story, and neither
# `lambda_http` nor `aws-sdk-apigatewaymanagement` are even compiled in, let
# alone linked. `cargo lambda build --features lambda` (what `make build`/
# `make deploy` pass) swaps that for `web_socket` instead. Exactly one of
# the two transport modules exists in a given binary -- see the module doc
# on `core::communication::web_messenger`.
[features]
lambda = ["dep:lambda_http", "dep:lambda_runtime", "dep:aws-sdk-apigatewaymanagement"]

[dependencies]
# TLS pinned to rustls/ring: aws-lc-rs (the default) needs cmake and a C
# toolchain that the eventual Lambda cross-build won't have.
aws-config = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "credentials-process",
  "sso",
] }
aws-sdk-apigatewaymanagement = { version = "1", optional = true, default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls",
] }
aws-sdk-chimesdkmeetings = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls",
] }
aws-sdk-dsql = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls",
] }
# Avatar/icon storage (core::media): presigned upload URLs, and the
# get/resize/put round trip that re-squares whatever a client uploaded.
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls",
] }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
futures-util = "0.3"
# Pure-Rust codecs only -- same reason as the rustls pin above: no cmake/C
# toolchain for the Lambda cross-build.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
# rust_crypto is a provider feature: without it jsonwebtoken has no signer.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
# Lambda entry point: `main.rs` hands `router::app` straight to
# `lambda_http::run` when the `lambda` feature is on. `optional`, not a
# plain dependency: a local build has no use for it at all.
lambda_http = { version = "1", optional = true }
# `map-authorizer`'s entry point: an AppSync authorizer event is plain JSON,
# not an HTTP request, so it takes the bare runtime rather than lambda_http.
lambda_runtime = { version = "1", optional = true }
# Lets `schema.rs` register each table into `orm::TABLES` at its own
# declaration, in a linker section `orm::generate` reads -- no separate list
# to keep in sync by hand.
linkme = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "macros",
  "chrono",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
fastrand = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
